<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%" class="w-full h-auto font-sans">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c31" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00e5ff" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Cascadia Code', Consolas, monospace; font-size: 15px; font-weight: bold; fill: #f8fafc; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: #94a3b8; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
    .label-bold { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; font-weight: bold; fill: #f8fafc; }
    .code { font-family: 'Cascadia Code', Consolas, monospace; font-size: 10.5px; fill: #00e5ff; }
    .badge { font-family: 'Cascadia Code', Consolas, monospace; font-size: 9.5px; font-weight: bold; }
  </style>

  <!-- Canvas Background -->
  <rect width="880" height="380" rx="16" fill="url(#panelGrad)" stroke="#1e293b" stroke-width="1.5" />

  
  <g transform="translate(30, 35)">
    <text class="title">Figure 4.1: The Lenski LTEE Hyperbolic Fitness Trajectory &amp; Historical Contingency</text>
    <text y="20" class="subtitle">Power-law deceleration punctuated by rare Citrate-like (Cit+) metabolic breakthroughs (Lenski, 1991, 2003)</text>
  </g>

  <!-- Left Chart: Lenski Hyperbolic Curve -->
  <g transform="translate(40, 75)">
    <rect width="450" height="265" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="15" y="15" width="230" height="22" rx="4" fill="#0369a1" />
    <text x="25" y="30" class="badge" fill="#e0f2fe">HYPERBOLIC FITNESS TRAJECTORY</text>

    <!-- Axes -->
    <g transform="translate(45, 50)">
      <line x1="0" y1="170" x2="360" y2="170" stroke="#64748b" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="170" stroke="#64748b" stroke-width="1.5" />

      <text x="360" y="188" class="code" font-size="10" fill="#94a3b8" text-anchor="end">Generation (t) ──►</text>
      <text x="-10" y="0" class="code" font-size="10" fill="#94a3b8" text-anchor="end">Fitness W(t)</text>

      <!-- Grid lines -->
      <line x1="0" y1="120" x2="350" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="0" y1="70" x2="350" y2="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Hyperbolic Curve: Early rapid rise, late diminishing returns -->
      <path d="M 0 160 Q 40 70, 180 65 T 350 60" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <text x="190" y="55" class="code" fill="#38bdf8">W(t) = (1 + c·t)^d</text>

      <!-- Punctuated Equilibrium Cit+ Jump -->
      <path d="M 220 64 L 235 25 Q 260 20, 350 15" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="4 2" filter="url(#glow-cyan)" />
      <circle cx="220" cy="64" r="5" fill="#facc15" />
      <text x="230" y="18" class="label-bold" fill="#facc15">Cit⁺ Breakthrough (31,500 gen)</text>

      <!-- Callout annotations -->
      <text x="15" y="100" class="subtitle" font-size="9.5">Early Rapid Adaptation</text>
      <text x="240" y="90" class="subtitle" font-size="9.5">Power-Law Deceleration</text>
    </g>
  </g>

  <!-- Right Chart: Homology vs Homoplasy Decision Tree -->
  <g transform="translate(510, 75)">
    <rect width="330" height="265" rx="10" fill="#090d16" stroke="#a855f7" stroke-width="1.5" />
    <rect x="15" y="15" width="180" height="22" rx="4" fill="#6b21a8" />
    <text x="25" y="30" class="badge" fill="#f3e8ff">HOMOLOGY VS HOMOPLASY</text>

    <!-- Tree Diagram -->
    <g transform="translate(25, 55)">
      <!-- Common Root -->
      <circle cx="140" cy="15" r="10" fill="#475569" />
      <text x="132" y="19" class="code" fill="#fff" font-size="9">LCA</text>
      <text x="140" y="38" class="subtitle" font-size="9" text-anchor="middle">Founder Gen 0</text>

      <!-- Branches -->
      <path d="M 130 22 L 60 70" stroke="#64748b" stroke-width="1.5" />
      <path d="M 150 22 L 220 70" stroke="#64748b" stroke-width="1.5" />

      <!-- Clade A -->
      <circle cx="60" cy="75" r="12" fill="#0369a1" />
      <text x="45" y="95" class="code" font-size="9" fill="#38bdf8">Clade A</text>

      <!-- Clade B -->
      <circle cx="220" cy="75" r="12" fill="#be123c" />
      <text x="205" y="95" class="code" font-size="9" fill="#f43f5e">Clade B</text>

      <!-- Convergence -->
      <path d="M 60 100 L 110 140" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />
      <path d="M 220 100 L 170 140" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

      <!-- Identical Motifs -->
      <rect x="90" y="145" width="100" height="36" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1.5" />
      <text x="140" y="162" class="code" font-size="9.5" text-anchor="middle" fill="#fff">XOR Half-Adder</text>
      <text x="140" y="174" class="badge" text-anchor="middle" fill="#c084fc">WL: 0x9f4a...</text>

      <text x="140" y="200" class="label-bold" text-anchor="middle" fill="#facc15">Convergent Evolution!</text>
    </g>
  </g>

</svg>