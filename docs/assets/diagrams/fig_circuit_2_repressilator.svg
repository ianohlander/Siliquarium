      <path d="M 30.0 84.9 L 32.5 86.6 L 35.0 87.7 L 37.5 88.0 L 40.0 87.7 L 42.5 86.6 L 45.0 84.9 L 47.5 82.6 L 50.0 79.8 L 52.5 76.5 L 55.0 72.9 L 57.5 69.0 L 60.0 65.0 L 62.5 61.0 L 65.0 57.1 L 67.5 53.5 L 70.0 50.2 L 72.5 47.4 L 75.0 45.1 L 77.5 43.4 L 80.0 42.3 L 82.5 42.0 L 85.0 42.3 L 87.5 43.4 L 90.0 45.1 L 92.5 47.4 L 95.0 50.2 L 97.5 53.5 L 100.0 57.1 L 102.5 61.0 L 105.0 65.0 L 107.5 69.0 L 110.0 72.9 L 112.5 76.5 L 115.0 79.8 L 117.5 82.6 L 120.0 84.9 L 122.5 86.6 L 125.0 87.7 L 127.5 88.0 L 130.0 87.7 L 132.5 86.6 L 135.0 84.9 L 137.5 82.6 L 140.0 79.8 L 142.5 76.5 L 145.0 72.9 L 147.5 69.0 L 150.0 65.0 L 152.5 61.0 L 155.0 57.1 L 157.5 53.5 L 160.0 50.2 L 162.5 47.4 L 165.0 45.1 L 167.5 43.4 L 170.0 42.3 L 172.5 42.0 L 175.0 42.3 L 177.5 43.4 L 180.0 45.1 L 182.5 47.4 L 185.0 50.2 L 187.5 53.5 L 190.0 57.1 L 192.5 61.0 L 195.0 65.0 L 197.5 69.0 L 200.0 72.9 L 202.5 76.5 L 205.0 79.8 L 207.5 82.6 L 210.0 84.9 L 212.5 86.6 L 215.0 87.7 L 217.5 88.0 L 220.0 87.7 L 222.5 86.6 L 225.0 84.9 L 227.5 82.6 L 230.0 79.8 L 232.5 76.5 L 235.0 72.9 L 237.5 69.0 L 240.0 65.0 L 242.5 61.0 L 245.0 57.1 L 247.5 53.5 L 250.0 50.2 L 252.5 47.4 L 255.0 45.1 L 257.5 43.4 L 260.0 42.3 L 262.5 42.0 L 265.0 42.3 L 267.5 43.4 L 270.0 45.1 L 272.5 47.4 L 275.0 50.2 L 277.5 53.5 L 280.0 57.1 L 282.5 61.0 L 285.0 65.0 L 287.5 69.0 L 290.0 72.9 L 292.5 76.5 L 295.0 79.8 L 297.5 82.6 L 300.0 84.9 L 302.5 86.6 L 305.0 87.7 L 307.5 88.0 L 310.0 87.7 L 312.5 86.6 L 315.0 84.9 L 317.5 82.6 L 320.0 79.8 L 322.5 76.5 L 325.0 72.9 L 327.5 69.0 L 330.0 65.0 L 332.5 61.0 L 335.0 57.1" stroke="#38bdf8" stroke-width="2" fill="none" />
      <path d="M 30.0 45.1 L 32.5 47.4 L 35.0 50.2 L 37.5 53.5 L 40.0 57.1 L 42.5 61.0 L 45.0 65.0 L 47.5 69.0 L 50.0 72.9 L 52.5 76.5 L 55.0 79.8 L 57.5 82.6 L 60.0 84.9 L 62.5 86.6 L 65.0 87.7 L 67.5 88.0 L 70.0 87.7 L 72.5 86.6 L 75.0 84.9 L 77.5 82.6 L 80.0 79.8 L 82.5 76.5 L 85.0 72.9 L 87.5 69.0 L 90.0 65.0 L 92.5 61.0 L 95.0 57.1 L 97.5 53.5 L 100.0 50.2 L 102.5 47.4 L 105.0 45.1 L 107.5 43.4 L 110.0 42.3 L 112.5 42.0 L 115.0 42.3 L 117.5 43.4 L 120.0 45.1 L 122.5 47.4 L 125.0 50.2 L 127.5 53.5 L 130.0 57.1 L 132.5 61.0 L 135.0 65.0 L 137.5 69.0 L 140.0 72.9 L 142.5 76.5 L 145.0 79.8 L 147.5 82.6 L 150.0 84.9 L 152.5 86.6 L 155.0 87.7 L 157.5 88.0 L 160.0 87.7 L 162.5 86.6 L 165.0 84.9 L 167.5 82.6 L 170.0 79.8 L 172.5 76.5 L 175.0 72.9 L 177.5 69.0 L 180.0 65.0 L 182.5 61.0 L 185.0 57.1 L 187.5 53.5 L 190.0 50.2 L 192.5 47.4 L 195.0 45.1 L 197.5 43.4 L 200.0 42.3 L 202.5 42.0 L 205.0 42.3 L 207.5 43.4 L 210.0 45.1 L 212.5 47.4 L 215.0 50.2 L 217.5 53.5 L 220.0 57.1 L 222.5 61.0 L 225.0 65.0 L 227.5 69.0 L 230.0 72.9 L 232.5 76.5 L 235.0 79.8 L 237.5 82.6 L 240.0 84.9 L 242.5 86.6 L 245.0 87.7 L 247.5 88.0 L 250.0 87.7 L 252.5 86.6 L 255.0 84.9 L 257.5 82.6 L 260.0 79.8 L 262.5 76.5 L 265.0 72.9 L 267.5 69.0 L 270.0 65.0 L 272.5 61.0 L 275.0 57.1 L 277.5 53.5 L 280.0 50.2 L 282.5 47.4 L 285.0 45.1 L 287.5 43.4 L 290.0 42.3 L 292.5 42.0 L 295.0 42.3 L 297.5 43.4 L 300.0 45.1 L 302.5 47.4 L 305.0 50.2 L 307.5 53.5 L 310.0 57.1 L 312.5 61.0 L 315.0 65.0 L 317.5 69.0 L 320.0 72.9 L 322.5 76.5 L 325.0 79.8 L 327.5 82.6 L 330.0 84.9 L 332.5 86.6 L 335.0 87.7" stroke="#10b981" stroke-width="2" fill="none" />

      <!-- Legend -->
      <rect x="345" y="28" width="60" height="80" rx="4" fill="#1f0a12" stroke="#4c0519" stroke-width="0.8" />
      <circle cx="353" cy="42" r="3.5" fill="#f43f5e" />
      <text x="361" y="45" class="code" font-size="8.5" fill="#f43f5e">V_A (0°)</text>
      <circle cx="353" cy="62" r="3.5" fill="#38bdf8" />
      <text x="361" y="65" class="code" font-size="8.5" fill="#38bdf8">V_B (120°)</text>
      <circle cx="353" cy="82" r="3.5" fill="#10b981" />
      <text x="361" y="85" class="code" font-size="8.5" fill="#10b981">V_C (240°)</text>
    </g>

    <!-- Phase Space Attractor Box -->
    <g transform="translate(16, 175)">
      <rect width="413" height="78" rx="8" fill="#14060c" stroke="#4c0519" stroke-width="1" />
      <text x="14" y="20" class="badge" fill="#fda4af">POINCARÉ LIMIT CYCLE ATTRACTOR</text>
      <text x="14" y="38" class="code" font-size="9" fill="#38bdf8">Closed orbital trajectory in 3D state space (LacI, TetR, cI)</text>
      <text x="14" y="54" class="subtitle" font-size="9">Stable attractor basin absorbs stochastic perturbations and thermal noise</text>
      <text x="14" y="70" class="code" font-size="8.8" fill="#facc15">Autonomous chronometer: coordinates temporal metabolic phases</text>
    </g>

    <!-- Callout -->
    <g transform="translate(16, 265)">
      <rect width="413" height="65" rx="8" fill="#4c0519" stroke="#9f1239" stroke-width="1" />
      <text x="14" y="20" class="label-bold" fill="#fda4af">Darwinian Fitness Value</text>
      <text x="14" y="38" class="subtitle" font-size="9.5">• Enables anticipatory behavior ahead of tidal nutrient cycles</text>
      <text x="14" y="54" class="code" font-size="8.8" fill="#facc15">★ Cells with internal clocks forage efficiently and avoid toxic surges</text>
    </g>
  </g>

</svg>